services:
  - type: web
    name: werizz
    runtime: python
    buildCommand: bash render_build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: HF_HUB_OFFLINE
        value: "0"
      - key: QDRANT_MODE
        value: local
      - key: GROQ_API_KEY
        sync: false

